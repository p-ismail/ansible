- name: install package
  hosts: local
  connection: local
  become: yes
  tasks:
  - name: install package
    ansible.builtin.package:
     name: "{{ item.name }}"
     state: "{{ item.state }}"
    loop: # list of map
    - { name: "nginx", state: "absent"} # map/dict
    - { name: "mysql" , state: "present"}
    - { name: "zip" , state: "present"}