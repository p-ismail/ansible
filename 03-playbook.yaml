- name: install and run the nginx
  hosts: web #tageting the web server present in the inventory
  become: yes # it means root user access
  tasks:
  - name : install the nginx  
    ansible.builtin.package:
      name: nginx
      state: present

  - name : run the nginx
    ansible.builtin.service:
     name: nginx
     state: started
     enabled: yes

